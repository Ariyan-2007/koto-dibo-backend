name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KotoDibo.sln

      - name: Build
        run: dotnet build KotoDibo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KotoDibo.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  # Validates the production image actually builds (catches Dockerfile/publish breakage before
  # it's promoted) — does NOT push anywhere. The real publish happens in docker-publish.yml, keyed
  # off `main`, so the registry's `latest` always matches what's actually on `main`.
  docker-build-check:
    name: Docker build check
    needs: build-and-test
    # `needs` alone only gates on success when a job has no `if` of its own — adding our branch
    # condition below replaces that implicit check, so it must be spelled out explicitly or a
    # failed build-and-test would no longer block this job.
    if: |
      needs.build-and-test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Promotes development straight onto main — no PR. GITHUB_TOKEN can't create PRs (GitHub blocks
  # Actions-authored PRs by default), and main only ever receives commits from this job, so main
  # has no independent history worth preserving; it's just a mirror of development once CI is green.
  promote-to-main:
    name: Push development to main
    needs: docker-build-check
    if: |
      needs.docker-build-check.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Push development to main
        run: git push origin HEAD:main --force
