name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KotoDibo.sln

      - name: Build
        run: dotnet build KotoDibo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KotoDibo.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  # Validates the production image actually builds (catches Dockerfile/publish breakage before
  # it's promoted) — does NOT push anywhere. The real publish happens in docker-publish.yml, keyed
  # off `main`, so the registry's `latest` always matches what's actually on `main`.
  docker-build-check:
    name: Docker build check
    needs: build-and-test
    # `needs` alone only gates on success when a job has no `if` of its own — adding our branch
    # condition below replaces that implicit check, so it must be spelled out explicitly or a
    # failed build-and-test would no longer block this job.
    if: |
      needs.build-and-test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Opens (or reuses) a development -> main PR and merges it immediately. Deliberately does NOT
  # wait for the PR's own status checks: build-and-test + docker-build-check already verified this
  # exact commit above, and a PR opened via GITHUB_TOKEN won't trigger this workflow's
  # pull_request trigger anyway (GitHub suppresses workflow runs triggered by GITHUB_TOKEN, to
  # prevent infinite loops) — so a check-gated merge would hang forever waiting for a run that
  # never happens. If `main` has required-review branch protection, this merge step will fail
  # until that's relaxed or the token used here has bypass rights.
  promote-to-main:
    name: Open & merge PR into main
    needs: docker-build-check
    if: |
      needs.docker-build-check.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse PR, then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_URL=$(gh pr list --base main --head development --state open --json url --jq '.[0].url')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head development \
              --title "Promote development to main" \
              --body "Automated promotion — build-and-test and docker-build-check passed on \`development\` at ${{ github.sha }}.")
          fi

          gh pr merge "$PR_URL" --merge --delete-branch=false
